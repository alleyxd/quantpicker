[package]
name = "quantpicker"
version = "0.1.0"
edition = "2024"
description = "Measures which GGUF quant of a model to run on your GPU: real speed and real quality loss"
license = "MIT"
repository = "https://github.com/alleyxd/quantpicker"
readme = "README.md"
keywords = ["llm", "gguf", "quantization", "llama-cpp", "benchmark"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
dirs = "7.0.0"
flate2 = "1.1.10"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
zip = "9.0.5"

[profile.release]
strip = true
lto = true
